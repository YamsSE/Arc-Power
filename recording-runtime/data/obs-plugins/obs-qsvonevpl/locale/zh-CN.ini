# Debug group
QPStatistics="QP 统计"
QPStatistics.Tooltip="录制结束时在 OBS 日志中输出每帧 QP 统计（按 I/P/B 帧类型的 min/max/avg/median）。\n纯诊断用途 — 不影响编码或 GPU/CPU 使用率。"
VideoHeaderHexDump="视频头 Hex Dump"
VideoHeaderHexDump.Tooltip="编码器初始化时将 SPS/PPS/VPS 原始字节以十六进制 dump 到 OBS 日志。\n用于调试比特流头部问题。纯诊断用途 — 不影响编码或 GPU/CPU 使用率。"
FrameStatistics="帧统计"
FrameStatistics.Tooltip="录制结束时在 OBS 日志中输出每帧统计（帧类型计数、码率、MAD、BRC Panic、参考列表）。\n需要在驱动中启用 MAD 计算。纯诊断用途 — 不影响编码或 GPU/CPU 使用率。"

MinQP="最小 QP"
MinQPDesc="最小量化参数约束。\n格式：\"-1\"（驱动默认）、\"12\"（所有类型相同）、\"12,12,12\"（I,P,B 分别设置）。\n防止 QP 低于指定值，限制最高质量。\n数值自动限制到有效范围。不影响 GPU 负载。"
MaxQP="最大 QP"
MaxQPDesc="最大量化参数约束。格式同最小 QP。\n防止 QP 超过指定值，限制最低质量。\n用于确保基准质量水平。不影响 GPU 负载。"

# ROI (Region of Interest)
ROIEditor="ROI 编码器设置"
ROIEditorDesc="配置感兴趣区域（ROI）编码，为画面不同区域分配不同的码率优先级。\n仅 H.264 和 HEVC 编码器支持。\n不直接影响 GPU/CPU 使用率；编码器根据优先级调整各区域 QP。"
ROIApply="应用"
ROICancel="取消"
ROISelectEncoder="选择编码器"
ROIRegions="ROI 区域（每行一个）"
ROIModeQPDelta="QP 增量模式"
ROIModePriority="优先级模式"
ROIRegionFormat="格式：Left Top Right Bottom DeltaQP [GradL GradT GradR GradB Steps]\n（渐变值强制为正向外发散，Steps 控制每边细分数量，默认 3）"
ROIRegionExample="例如：0 0 0.5 0.5 -10   0.5 0 1 0.5 5   0.1 0.1 0.9 0.9 6 0.1 0.1 0.1 0.1 5"
ROIEnabled="启用 ROI"
ROIDeltaQP="DeltaQP"
ROIMode="ROI 模式"
ROIPreview="预览画面"
ROIEncoder="编码器"
ROIApplySuccess="ROI 参数已应用！"
AlwaysOnTop="窗口置顶"
ROIInfoDisabled="ROI 已禁用或未配置区域。"
ROIInfoHeader="模式：%1 | 区域数量：%2"

# VPP ProcAmp (色彩调整)
VPPProcAmp="ProcAmp（色彩调整）"
VPPProcAmpDesc="色彩调整（ProcAmp）控制亮度、对比度、色相和饱和度。\n允许在编码前对视频信号进行实时色彩校正。\n启用时增加 GPU 负载。不影响 CPU 使用率。"
VPPProcAmpBrightness="亮度"
VPPProcAmpBrightnessDesc="亮度调整（-100 到 100）。0 = 无变化。\n用于校正曝光不足或过度的视频。\n极端值下 GPU 负载较高。"
VPPProcAmpContrast="对比度"
VPPProcAmpContrastDesc="对比度调整（0.0 到 10.0）。1.0 = 无变化。\n增加亮部和暗部之间的差异。\n极端值下 GPU 负载较高。"
VPPProcAmpHue="色相"
VPPProcAmpHueDesc="色相旋转（-180 到 180 度）。0 = 无变化。\n整体偏移视频的色调。\n对 GPU 影响极小。"
VPPProcAmpSaturation="饱和度"
VPPProcAmpSaturationDesc="饱和度调整（0.0 到 10.0）。1.0 = 无变化。\n0 = 灰度。较高值产生更鲜艳的色彩。\n对 GPU 影响极小。"

# VPP Rotation（旋转）
VPPRotation="旋转"
VPPRotationDesc="将视频帧旋转指定角度。\n90/270 度旋转会交换宽度和高度。\n增加 GPU 负载。不影响 CPU 使用率。"

# VPP Mirroring（镜像）
VPPMirroring="镜像"
VPPMirroringDesc="水平、垂直或双向镜像视频帧。\n用于前置摄像头校正或创意特效。\n对 GPU 影响极小。"

# VPP Frame Rate Conversion（帧率转换）
VPPFRC="帧率转换"
VPPFRCDesc="转换视频流的帧率。\nPRESERVE_TIMESTAMP：保留原始 PTS 值，调整持续时间。\nDISTRIBUTED_TIMESTAMP：均匀重新分配 PTS。\nFRAME_INTERPOLATION：插值新帧以获得更平滑的运动。\n组合模式同时使用时间戳调整和插值。\n启用时显著增加 GPU 负载。"
VPPFRCOutFPS="输出帧率"
VPPFRCOutFPSDesc="帧率转换的目标输出帧率（fps）。\n设置与源帧率不同的值以启用 FRC。\n常见值：30、60、120、144。必须是有效的显示器刷新率。"

