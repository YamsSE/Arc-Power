<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Arc Power</title>
  <link rel="stylesheet" href="./splash.css">
</head>
<body>
  <main class="splash" aria-label="Arc Power loading">
    <div class="splash-art-wrap">
      <img class="splash-art" src="../assets/Arc Power.png" alt="Arc Power">
    </div>
    <div class="splash-brand">Arc <span>Power</span></div>
    <div class="splash-progress" role="progressbar" aria-label="Loading Arc Power">
      <div class="splash-progress-glow"></div>
    </div>
    <p class="splash-status">Starting Arc Power...</p>
  </main>
</body>
</html>
