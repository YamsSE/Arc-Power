<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Arc Power</title>
  <!-- M2C-B B6: the blue "AP" favicon (generated by scripts/make-icon.js). -->
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <script src="./theme-bootstrap.js"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <!-- M4-D: the INTEGRATED title bar (frameless window) - the
         : the brand sits CENTERED in the title bar (the logo on top,
         'Arc Power' below it - 'Power' in the website's blue gradient), the
         window controls in the right cluster. The drag regions
         (left zone + the brand) are -webkit-app-region: drag (Electron
         handles double-click-to-maximize there); the controls cluster is
         no-drag so the buttons stay clickable. The wiring lives in
         components/titlebar.ts (app.ts boots it). -->
    <div id="titlebar" class="titlebar">
      <div class="titlebar-left">
        <img class="titlebar-corner-icon" src="../assets/icon.png" alt="" aria-hidden="true">
        <span class="titlebar-version" id="titlebar-version"></span>
        <button class="titlebar-update-btn" id="titlebar-update-btn" title="Check for updates" aria-label="Check for updates" style="display:none">
          <svg class="icon-update-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
          <svg class="icon-update-download" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <svg class="icon-update-done" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
        <div class="titlebar-drag" title="Arc Power"></div>
      </div>
      <div class="titlebar-brand">
        <img class="titlebar-logo" src="../assets/icon.png" alt="Arc Power logo">
        <div class="titlebar-brand-name">Arc <span class="titlebar-brand-power">Power</span></div>
      </div>
      <div class="titlebar-cluster">
        <div class="titlebar-controls">
          <button class="window-btn window-btn-min" data-op="minimize" title="Minimize" aria-label="Minimize">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
          <button class="window-btn window-btn-max" data-op="maximize-toggle" title="Maximize" aria-label="Maximize">
            <!-- M4J (F): ONE svg - the CONTENT swaps by state (the two
                 groups are class-toggled; the pre-M4J markup had TWO svg
                 elements, the repeat request). Maximize = the single
                 hollow square; restore = the Windows layout: the HOLLOW
                 back square at the TOP-LEFT (1.5,1.5) with the FILLED front
                 square at the BOTTOM-RIGHT (3.5,3.5) (the front fill
                 resolves from the .icon-restore-front class to the
                 titlebar background). titlebar.ts toggles the
                 icon-state-restore class on the svg. -->
            <svg class="icon-maximize-restore" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
              <g class="icon-maximize">
                <rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.2"/>
              </g>
              <g class="icon-restore">
                <rect class="icon-restore-back" x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/>
                <rect class="icon-restore-front" x="3.5" y="3.5" width="7" height="7" stroke="currentColor" stroke-width="1.2"/>
              </g>
            </svg>
          </button>
          <button class="window-btn window-btn-close" data-op="close" title="Close" aria-label="Close">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 1.5 L10.5 10.5 M10.5 1.5 L1.5 10.5" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div id="app-body">
      <aside id="sidebar"></aside>
      <main id="shell">
        <header id="gpu-header"></header>
        <section id="page"></section>
      </main>
    </div>
  </div>
  <script src="./out/app.js"></script>
</body>
</html>
