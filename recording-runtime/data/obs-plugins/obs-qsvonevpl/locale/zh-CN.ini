# AV1 AuxData
AV1CDEF="CDEF 滤波"
AV1CDEFDesc="约束方向增强滤波。减少 AV1 编码中边缘周围的振铃伪影。\n影响视觉质量和压缩效率。对 GPU 影响极小。"
AV1Restoration="环路恢复滤波"
AV1RestorationDesc="环路恢复滤波（Wiener/自引导）。恢复丢失的高频细节并减少伪影。\n以轻微编码开销为代价提升感知质量。对 GPU 影响极小。"
AV1LoopFilter="环路滤波"
AV1LoopFilterDesc="去块效应环路滤波控制。减少块边界处的块状伪影。\n关闭可能提高锐度但会引入可见伪影。对 GPU 影响极小。"
AV1SuperRes="超分辨率"
AV1SuperResDesc="AV1 自适应超分辨率。对高细节帧进行降采样再升采样，在低码率下提高编码效率。\n对流媒体场景有用。由于额外的缩放操作，增加 GPU 负载。"
AV1InterpFilter="插值滤波器"
AV1InterpFilterDesc="运动补偿插值滤波器类型。控制子像素运动的插值方式。\nEIGHTTAP_SHARP：保留更多细节，GPU 负载略高。\nBILINEAR：更快但更柔和，GPU 负载更低。"
AV1ErrorResilient="错误弹性模式"
AV1ErrorResilientDesc="错误弹性编码模式。在比特流中插入额外同步点以帮助从数据丢失中恢复。\n对直播有用但可能降低压缩效率。不影响 GPU/CPU 使用率。"
AV1Segmentation="AV1 分段"
AV1SegmentationDesc="启用静态双分段映射的 AV1 分段。画面中心 50% 区域使用分段 1，QP 差值为 -10，以提升焦点区域画质。\n仅适用于 AV1 编码。\n由于分段模式决策，略微增加 GPU 负载。"

# Deblocking
Deblocking="去块滤波"
DeblockingDesc="去块效应滤波器。减少块边界处的块状伪影。\n★ 开启此选项的代价：用 1 倍锐度换取 0.5 倍画面平滑度 ★\n非自然视频推荐保持关闭状态。\n关闭可获得非常显著的锐度提升，推荐高画质录制时选择（默认）\n对 GPU 影响极小。"

# VPP MCTF
VPPMCTF="MCTF（运动补偿时域滤波）"
VPPMCTFDesc="运动补偿时域滤波。通过分析帧间运动减少时域噪声。\n对于有运动内容的视频比空间降噪更有效。\n高强度可能导致运动模糊。数值越高 GPU 消耗会较大增加。不影响 CPU 使用率。"
VPPMCTFStrength="MCTF 滤波强度"
VPPMCTFStrengthDesc="MCTF 时域滤波强度。范围 0-20。\n较高值提供更强的降噪效果但可能引入运动模糊。\n数值越高 GPU 消耗会较大增加。不影响 CPU 使用率。"

# Weighted Prediction
WeightedPred="加权预测"
WeightedPredDesc="P 帧加权预测。允许对参考样本加权以提高淡入淡出场景的预测效率。\n对光照变化的内容可改善压缩效果。对 GPU 影响极小。\n双向加权预测（B 帧）将自动同步为此相同设置。"

# Adaptive Max Frame Size
MaxFrameSizeMode="最大帧大小模式"
MaxFrameSizeModeDesc="控制最大帧大小的应用方式。\n自动：驱动决定（推荐）。\n全部：所有帧类型使用同一限制。\n按帧类型：I 帧和 P/B 帧分别设置。"
MaxFrameSizeMode.Auto="自动（驱动默认）"
MaxFrameSizeMode.All="全部帧"
MaxFrameSizeMode.PerType="按帧类型"
MaxFrameSizeAll="最大帧大小 全部 (bytes)"
MaxFrameSizeAllDesc="所有帧类型的最大编码帧大小（字节）。\n0 = 驱动自动选择。设置非零值可防止超大帧。\n超大帧在串流场景中可能导致缓冲下溢。\n不影响 GPU 负载。仅部分码率控制模式支持。"
MaxFrameSizeI="最大帧大小 I"
MaxFrameSizeIDesc="仅限 I 帧的最大编码帧大小（字节）。\n0 = 驱动自动选择。\n不影响 GPU 负载。仅部分码率控制模式支持。"
MaxFrameSizeP="最大帧大小 P/B"
MaxFrameSizePDesc="P 帧和 B 帧的最大编码帧大小（字节）。\n根据 API 规范：设置 MaxFrameSizeP 时也必须设置 MaxFrameSizeI。\n0 = 驱动自动选择。\n不影响 GPU 负载。仅部分码率控制模式支持。"

# BRC Panic Mode
BRCPanicMode="BRC 恐慌模式"
BRCPanicModeDesc="控制 BRC 检测到码率溢出时的行为。\nAUTO=驱动默认，ON=允许恐慌回退，OFF=禁止。\n仅影响 AVC（H.264）编码。"



# Custom Coding Options
CustomCodingOptions="自定义编码选项"
CustomCodingOptionsDesc="允许覆盖 mfxExtCodingOption、mfxExtCodingOption2、mfxExtCodingOption3 和\nmfxExtCodingOptionDDI 中的单个字段。\n每行使用 '作用域.字段名=值' 格式。\n作用域：CO、CO2、CO3、CODDI。值：ON、OFF 或数字。\n以 # 或 ; 开头的行将被忽略。\n示例：\n  CO.RateDistortionOpt=ON\n  CO2.FixedFrameRate=OFF\n  CODDI.BRCPrecision=3"

