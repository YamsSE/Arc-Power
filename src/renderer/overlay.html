<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- M5: the overlay window's CSP - like index.html (style-src 'self'
       only; the renderer's CSSOM font-size scaling is NOT blocked by it). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Arc Power Overlay</title>
  <link rel="stylesheet" href="./overlay.css">
</head>
<body>
  <!-- M5: the RTSS-style HUD - BOLD TEXT ONLY, no boxes, no background.
       The six stat lines (FPS / CPU / RAM / GPU / VRAM - M12: the Memory +
       VRAM rows joined below the CPU / GPU rows - / API value - M13: the
       standalone Graphics-API value joined between the VRAM row and the
       frametime strip, above the graph) + the frametime polyline strip.
       M16: the GPU row carries the voltage as a FIELD between the temp and
       the power fields ('GPU  42%  2500MHz  65°C  0.652V  38.8W  1030RPM' -
       M18: every value-unit pair is GLUED) - there is NO standalone Voltage
       row; the line count stays at SIX.
       M6-amd2: a frametime VALUE line sits DIRECTLY BELOW
       the canvas (the retracted "below the FPS" part - the graph stays at
       the bottom) - the latest derived frame time, max 2 decimals
       ('16.67ms'), '-' when no data. The 'frametime' stat controls BOTH
       the strip and the number (stat off -> both hidden).
       M7b (fix 4): the OPTIONAL background box - a translucent rounded
       box behind the HUD (the Appearance card's Background section). The
       #overlay-backdrop div is the FIRST child of #overlay-root (behind
       the in-flow HUD); hidden by default, shown via the .visible class
       + the --overlay-bg-color / --overlay-bg-opacity CSS vars (both
       CSSOM-driven by overlay.ts from the persisted settings - the
       --overlay-color pattern). -->
  <div id="overlay-root">
    <!-- Independent hook-free provider. This is an original Arc Power
         renderer inspired by grouped performance HUDs; it does not load or
         redistribute CapFrameX binaries. -->
    <div id="capframex-root" aria-hidden="true">
      <div class="capframex-panel">
        <div class="capframex-gpu-sections" id="capframex-gpu-sections"></div>
        <div class="capframex-section capframex-cpu-section">
          <div class="capframex-section-title capframex-cpu-title" id="capframex-cpu-title">CPU</div>
        </div>
        <div class="capframex-row capframex-memory-row"><span class="capframex-label">RAM Info</span><span id="capframex-memory"></span></div>
        <div class="capframex-api-row" id="capframex-api-row"><span id="capframex-api"></span></div>
        <div class="capframex-summary" aria-label="Frame rate summary">
          <div><span class="capframex-summary-label">Average</span><strong id="capframex-avg"></strong></div>
          <div><span class="capframex-summary-label">1% Low</span><strong id="capframex-low1"></strong></div>
          <div><span class="capframex-summary-label">0.1% Low</span><strong id="capframex-low01"></strong></div>
          <div><span class="capframex-summary-label">99%tile</span><strong id="capframex-p99"></strong></div>
          <div><span class="capframex-summary-label">Performance</span><strong id="capframex-performance"></strong><span id="capframex-performance-ft"></span></div>
        </div>
        <div class="capframex-chart-card" id="capframex-frametime-card">
          <div class="capframex-chart-heading"><span>Frametime</span><span id="capframex-frametime-value"></span></div>
          <canvas id="capframex-frametime" class="capframex-chart"></canvas>
        </div>
        <div class="capframex-chart-card" id="capframex-displaytime-card">
          <div class="capframex-chart-heading"><span>Displaytime</span><span id="capframex-displaytime-value"></span></div>
          <canvas id="capframex-displaytime" class="capframex-chart"></canvas>
        </div>
      </div>
    </div>
    <div id="overlay-backdrop"></div>
    <!-- The divider spans the complete stat stack. GPU/VRAM use their stable
         physical ordinal when multiple adapters are known, including when a
         non-display adapter is monitored by itself. -->
    <div id="overlay-divider"></div>
    <div class="overlay-line" id="overlay-fps"></div>
    <div class="overlay-line" id="overlay-cpu"></div>
    <div class="overlay-line" id="overlay-memory"></div>
    <div class="overlay-line" id="overlay-gpu"></div>
    <div class="overlay-line" id="overlay-vram"></div>
    <div class="overlay-line overlay-secondary" id="overlay-gpu2"></div>
    <div class="overlay-line overlay-secondary" id="overlay-vram2"></div>
    <div id="overlay-secondary-rows"></div>
    <div class="overlay-line" id="overlay-api"></div>
    <canvas id="overlay-frametime" class="overlay-frametime"></canvas>
    <div class="overlay-line overlay-frametime-value" id="overlay-frametime-value"></div>
  </div>
  <script src="./out/overlay.js"></script>
</body>
</html>
