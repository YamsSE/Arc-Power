<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Arc Power</title>
  <link rel="stylesheet" href="./splash.css">
</head>
<body>
  <main class="splash" aria-label="Arc Power loading">
    <div class="splash-art-wrap">
      <img class="splash-art" src="../assets/ArcPowerIcon-splash.png" alt="Arc Power">
    </div>
    <div class="splash-brand">Arc <span>Power</span></div>
    <div class="splash-progress" role="progressbar" aria-label="Loading Arc Power">
      <div class="splash-progress-value"></div>
    </div>
    <p class="splash-status" aria-live="polite">Starting Arc Power...</p>
    <section class="splash-update-actions" aria-live="polite" hidden>
      <p class="splash-update-title">A new version of Arc Power is ready</p>
      <div class="splash-update-buttons">
        <button class="splash-update-primary" id="splash-update-now" type="button">UPDATE NOW</button>
        <button class="splash-update-secondary" id="splash-skip-update" type="button">SKIP FOR NOW</button>
      </div>
    </section>
  </main>
  <script src="./splash.js"></script>
</body>
</html>
